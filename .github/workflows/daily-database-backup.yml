name: Daily database backup

on:
  schedule:
    # 00:00 Asia/Ho_Chi_Minh (UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Supabase database to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
      DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
      DB_DATABASE: ${{ secrets.BACKUP_DB_DATABASE }}
      DB_USERNAME: ${{ secrets.BACKUP_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create database dump
        run: |
          backup_file="$(bash scripts/backup-database.sh "$RUNNER_TEMP")"
          printf 'BACKUP_FILE=%s\n' "$backup_file" >> "$GITHUB_ENV"

      # A service account is only needed for a Google Workspace Shared Drive.
      # Personal Google Drive uses the OAuth refresh-token secrets above.
      - name: Prepare optional Shared Drive credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            credential_file="$RUNNER_TEMP/google-drive-service-account.json"
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credential_file"
            chmod 600 "$credential_file"
            printf 'GOOGLE_SERVICE_ACCOUNT_JSON_FILE=%s\n' "$credential_file" >> "$GITHUB_ENV"
          fi

      - name: Upload encrypted backup to Google Drive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE secret}"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" \
            --output "$BACKUP_FILE.gpg" "$BACKUP_FILE"
          rm -f "$BACKUP_FILE"
          printf 'BACKUP_FILE=%s.gpg\n' "$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Install Google Drive client libraries
        run: |
          python -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth

      - name: Upload backup
        run: python scripts/upload-backup-to-google-drive.py "$BACKUP_FILE"
