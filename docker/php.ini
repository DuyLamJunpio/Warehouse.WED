; Cấu hình PHP cho bản chạy thật (Docker).
;
; Ảnh php:8.3-apache KHÔNG kèm php.ini nào, nên nếu thiếu file này PHP dùng giá
; trị mặc định biên dịch sẵn: post_max_size 8M, upload_max_filesize 2M. Form sản
; phẩm cho phép tải video tới 50MB nên mọi lần thêm sản phẩm có video đều bị PHP
; chặn giữa chừng - thanh tiến trình đứng yên, còn phần thân trả về là cảnh báo
; HTML nên JS không đọc được thông báo lỗi.

; Một file tối đa 60MB (form giới hạn 50MB, chừa dư cho phần bao MIME).
upload_max_filesize = 60M
; Tổng cả biểu mẫu: nhiều ảnh kèm một video vẫn phải lọt.
post_max_size = 150M
max_file_uploads = 40

; Tải file lên máy chủ ở xa rồi đẩy tiếp lên Supabase Storage nên cần rộng tay.
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Cảnh báo in thẳng ra phần thân sẽ phá cấu trúc JSON mà giao diện đang đọc;
; ghi vào log để xem trong bảng điều khiển Render.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Múi giờ và mã hóa dùng chung.
date.timezone = Asia/Ho_Chi_Minh
default_charset = UTF-8
